name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 아직 Gradle 프로젝트가 없을 때(첫 커밋)는 빌드를 건너뛴다. 이슈 #1에서 프로젝트를 만들면 자동으로 동작.
      - name: Check Gradle project
        id: gradle
        run: |
          if [ -f gradlew ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.gradle.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gradle.outputs.exists == 'true'

      - name: Build & Test
        if: steps.gradle.outputs.exists == 'true'
        run: |
          chmod +x gradlew
          ./gradlew build
